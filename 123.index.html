<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减脂日历 · 我的减肥记录</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#98a2b3;
    --primary:#4f8cff;
    --primary-soft:#e9f0ff;
    --green:#22c55e;
    --green-soft:#e8f9ef;
    --red:#f0554d;
    --border:#e8ecf4;
    --shadow:0 4px 18px rgba(31,41,55,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
    padding:22px 18px 60px;
  }
  .wrap{max-width:1240px;margin:0 auto}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:20px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(135deg,#4f8cff,#6ee7b7);
    display:flex;align-items:center;justify-content:center;
    font-size:23px;box-shadow:0 6px 16px rgba(79,140,255,.3);
  }
  .brand h1{font-size:20px;font-weight:700;letter-spacing:.3px}
  .brand p{font-size:12px;color:var(--muted);margin-top:2px}

  .year-nav{display:flex;align-items:center;gap:6px;background:var(--card);
    padding:6px;border-radius:14px;box-shadow:var(--shadow)}
  .year-nav button{
    width:34px;height:34px;border:none;border-radius:10px;background:transparent;
    font-size:17px;color:var(--muted);cursor:pointer;transition:.15s;
    display:flex;align-items:center;justify-content:center;
  }
  .year-nav button:hover:not(:disabled){background:var(--primary-soft);color:var(--primary)}
  .year-nav button:disabled{opacity:.25;cursor:not-allowed}
  .year-nav #yearLabel{font-size:15px;font-weight:700;min-width:56px;text-align:center}
  .year-nav .today-btn{width:auto;padding:0 14px;font-size:13px;font-weight:600;color:var(--primary)}
  .year-nav .today-btn:hover{background:var(--primary-soft)}
  .year-nav .today-btn:disabled{opacity:.35}

  /* ---------- 统计卡 ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{
    background:var(--card);border-radius:16px;padding:15px 17px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;
    border:1px solid rgba(232,236,244,.7);
  }
  .stat-label{font-size:12px;color:var(--muted)}
  .stat-value{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
  .stat-value small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
  .stat-value.down{color:var(--green)}
  .stat-value.up{color:var(--red)}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    border:1px solid rgba(232,236,244,.7);padding:18px;
  }
  .card-title{
    font-size:14px;font-weight:700;margin-bottom:14px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .card-title::before{
    content:'';width:3px;height:14px;border-radius:2px;background:var(--primary);
  }
  .card-title .legend{
    margin-left:auto;font-size:11.5px;font-weight:500;color:var(--muted);
    display:flex;align-items:center;gap:5px;
  }
  .card-title .legend i{
    font-style:normal;color:var(--green);font-weight:900;font-size:12px;
  }

  /* ---------- 月份控制条 ---------- */
  .month-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;margin-bottom:16px;
    background:linear-gradient(180deg,#f8faff,#f2f6ff);
    border:1px solid #e3ecff;border-radius:14px;
  }
  .month-bar .mb-left{display:flex;align-items:center;gap:8px}
  .month-bar button.mb-arrow{
    width:30px;height:30px;border:none;border-radius:9px;background:#fff;
    color:#5b6478;cursor:pointer;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 4px rgba(31,41,55,.08);transition:.15s;
  }
  .month-bar button.mb-arrow:hover{background:var(--primary);color:#fff}
  .month-bar .mb-title{
    font-size:15px;font-weight:800;color:#2b3648;min-width:100px;text-align:center;
    letter-spacing:.3px;
  }
  .month-bar .mb-title small{font-size:11px;font-weight:600;color:var(--muted);margin-left:5px}
  .month-bar .mb-chips{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
  .month-bar .chip{
    border:1px solid #dde6f5;background:#fff;color:#7a8496;
    font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;
    cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .month-bar .chip:hover{border-color:var(--primary);color:var(--primary)}
  .month-bar .chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .month-bar .chip.has-dot::after{
    content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--green);margin-left:5px;vertical-align:middle;
  }
  .month-bar .chip.active.has-dot::after{background:#fff}
  .month-bar .mb-toggle{
    border:1.5px solid #dde6f5;background:#fff;color:#5b6478;
    font-size:12px;font-weight:700;padding:6px 13px;border-radius:20px;
    cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .month-bar .mb-toggle:hover{border-color:var(--primary);color:var(--primary)}
  .month-bar .mb-toggle.on{background:var(--primary-soft);border-color:#bcd6ff;color:var(--primary)}

  /* ---------- 日历 ---------- */
  .months{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));
    gap:16px 14px;
  }
  .months.single{
    grid-template-columns:minmax(0,340px);
    justify-content:center;
  }
  .month{min-width:0}
  .month-title{
    font-size:12.5px;font-weight:700;color:#5b6478;margin-bottom:7px;
    display:flex;align-items:center;gap:6px;
  }
  .month-title .cnt{
    font-size:10px;font-weight:600;color:var(--green);
    background:var(--green-soft);border-radius:20px;padding:1px 7px;
  }
  .months.single .month-title{font-size:14px;margin-bottom:10px}
  .months.single .grid{gap:4px}
  .months.single .cell{font-size:13px;border-radius:10px}
  .months.single .cell .wt{font-size:10px}
  .months.single .cell .check{font-size:11px;right:4px;bottom:3px}
  .months.single .dow{font-size:11px}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .dow{
    font-size:10px;color:#b3bccc;text-align:center;
    padding-bottom:3px;font-weight:600;
  }
  .dow:first-child,.dow:last-child{color:#e0a2a2}
  .cell{
    aspect-ratio:1/1;border-radius:8px;border:1.5px solid transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11px;color:#6b7488;cursor:pointer;position:relative;
    transition:background .14s,border-color .14s,transform .1s;
    user-select:none;line-height:1;
  }
  .cell:hover{background:var(--primary-soft);border-color:#c5dbff;transform:scale(1.06)}
  .cell.empty{pointer-events:none;visibility:hidden}
  .cell .wt{font-size:8.5px;font-weight:700;color:var(--green);margin-top:2px}
  .cell .check{
    position:absolute;right:2px;bottom:1px;
    font-size:9px;font-weight:900;color:var(--green);
    line-height:1;text-shadow:0 0 2px #fff;
  }
  .cell.has-data{background:var(--green-soft);color:#178a4c;font-weight:600}
  .cell.has-data:hover{background:#d5f4e4;border-color:#a8e6c5}
  .cell.today{border-color:var(--primary);color:var(--primary);font-weight:800}
  .cell.today.has-data{color:#178a4c;background:var(--green-soft);border-color:var(--primary)}
  .cell.future{color:#cbd2e0;cursor:default}
  .cell.future:hover{background:transparent;border-color:transparent;transform:none}
  .cell.future.has-data{background:var(--green-soft);color:#178a4c}

  /* ---------- 图表 ---------- */
  .charts{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;
  }
  .chart-card{
    background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    border:1px solid rgba(232,236,244,.7);padding:18px;
  }
  .chart-card.wide{grid-column:1/-1}
  .chart-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;gap:10px;flex-wrap:wrap;
  }
  .chart-head h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .chart-head h3::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--primary)}
  .chart-head .hint{font-size:11.5px;color:var(--muted)}
  .chart-canvas{width:100%;height:210px;display:block}
  .chart-card.wide .chart-canvas{height:240px}

  .range-switch{display:flex;gap:2px;background:#f2f5fb;border-radius:10px;padding:3px}
  .range-switch button{
    border:none;background:transparent;font-size:12px;font-weight:600;color:var(--muted);
    padding:5px 12px;border-radius:8px;cursor:pointer;transition:.15s;font-family:inherit;
  }
  .range-switch button.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(31,41,55,.1)}

  /* ---------- 弹窗 ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(23,32,48,.45);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{
    background:#fff;border-radius:22px;width:100%;max-width:480px;
    max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 24px 60px rgba(15,23,42,.28);
    transform:translateY(14px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  }
  .overlay.show .modal{transform:translateY(0) scale(1)}
  .modal-head{
    padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .modal-head h2{font-size:16px;font-weight:700}
  .modal-head h2 span{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
  .icon-btn{
    width:30px;height:30px;border-radius:9px;border:none;background:#f3f5fa;
    color:#8b95a7;cursor:pointer;font-size:14px;transition:.15s;
  }
  .icon-btn:hover{background:#e8ecf4;color:var(--text)}
  .modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field label{font-size:12.5px;font-weight:600;color:#5b6478}
  .field input[type=number],.field input[type=time],.field textarea,.field select{
    width:100%;border:1.5px solid var(--border);border-radius:11px;
    padding:10px 12px;font-size:14px;font-family:inherit;color:var(--text);
    background:#fbfcfe;outline:none;transition:.15s;
  }
  .field textarea{resize:vertical;min-height:74px;line-height:1.6}
  .field input:focus,.field textarea:focus,.field select:focus{
    border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(79,140,255,.12);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sleep-hint{
    font-size:12px;color:var(--primary);font-weight:600;
    background:var(--primary-soft);border-radius:10px;padding:8px 12px;margin-top:-6px;
  }

  /* 饭后运动打卡按钮 */
  .post-meal-btn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:1.5px solid var(--border);border-radius:12px;
    padding:11px 14px;background:#fbfcfe;cursor:pointer;
    font-family:inherit;font-size:13.5px;font-weight:600;color:#7a8496;
    transition:background .18s,border-color .18s,color .18s;
  }
  .post-meal-btn:hover{border-color:#c5dbff;background:#f5f9ff}
  .post-meal-btn .pm-box{
    width:20px;height:20px;border-radius:6px;border:2px solid #cbd5e6;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:.18s;
  }
  .post-meal-btn .pm-box::after{
    content:'✓';font-size:13px;font-weight:900;line-height:1;
    color:transparent;transition:color .18s;
  }
  .post-meal-btn.done{
    background:var(--green-soft);border-color:#7fdcae;color:#178a4c;
  }
  .post-meal-btn.done:hover{background:#d5f4e4;border-color:var(--green)}
  .post-meal-btn.done .pm-box{
    background:var(--green);border-color:var(--green);
  }
  .post-meal-btn.done .pm-box::after{color:#fff}
  .post-meal-btn .pm-tag{
    margin-left:auto;font-size:11px;font-weight:700;color:var(--green);
    opacity:0;transition:opacity .18s;
  }
  .post-meal-btn.done .pm-tag{opacity:1}

  .ex-row{display:grid;grid-template-columns:1fr 92px 32px;gap:8px;margin-bottom:8px;align-items:center}
  .ex-row select,.ex-row input{
    border:1.5px solid var(--border);border-radius:11px;padding:9px 11px;
    font-size:13.5px;font-family:inherit;background:#fbfcfe;outline:none;
    color:var(--text);width:100%;transition:.15s;
  }
  .ex-row select:focus,.ex-row input:focus{border-color:var(--primary);background:#fff}
  .ex-del{
    width:32px;height:32px;border-radius:9px;border:none;background:#fdf0ef;
    color:#e0736c;cursor:pointer;font-size:12px;transition:.15s;
  }
  .ex-del:hover{background:#fadbd9;color:var(--red)}
  .btn-ghost{
    border:1.5px dashed #ccd6e8;background:transparent;border-radius:11px;
    padding:9px;font-size:13px;font-weight:600;color:var(--primary);
    cursor:pointer;font-family:inherit;transition:.15s;width:100%;
  }
  .btn-ghost:hover{background:var(--primary-soft);border-color:var(--primary)}
  .modal-foot{
    padding:14px 20px;border-top:1px solid var(--border);
    display:flex;align-items:center;gap:9px;background:#fcfdff;
  }
  .btn{
    border:none;border-radius:11px;padding:10px 18px;font-size:13.5px;
    font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,140,255,.3)}
  .btn.primary:hover{background:#3d7cf0}
  .btn.ghost{background:#f1f4fa;color:#66708a}
  .btn.ghost:hover{background:#e6ebf5}
  .btn.danger{background:transparent;color:#e0736c;padding:10px 12px}
  .btn.danger:hover{background:#fdf0ef;color:var(--red)}
  .spacer{flex:1}

  @media (max-width:820px){
    body{padding:16px 12px 50px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .charts{grid-template-columns:1fr}
    .chart-card.wide{grid-column:auto}
    .months{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px 10px}
    .brand h1{font-size:18px}
    .month-bar .mb-title{min-width:78px;font-size:14px}
  }
  @media (max-width:420px){
    .months{grid-template-columns:1fr 1fr;gap:14px 8px}
    .months.single{grid-template-columns:minmax(0,1fr)}
    .cell{font-size:10px}
    .cell .wt{font-size:7.5px}
    .cell .check{font-size:8px}
    .stat-value{font-size:19px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="brand">
      <div class="logo">🏃</div>
      <div>
        <h1>减脂日历</h1>
        <p>记录每一天，看见每一点变化</p>
      </div>
    </div>
    <div class="year-nav">
      <button id="prevYear" title="上一年">‹</button>
      <span id="yearLabel">2026</span>
      <button id="nextYear" title="下一年">›</button>
      <button class="today-btn" id="todayBtn">今天</button>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats">
    <div class="stat">
      <span class="stat-label">记录天数</span>
      <span class="stat-value" id="stDays">0 <small>天</small></span>
    </div>
    <div class="stat">
      <span class="stat-label">最新体重</span>
      <span class="stat-value" id="stWeight">--</span>
    </div>
    <div class="stat">
      <span class="stat-label">累计变化</span>
      <span class="stat-value" id="stDelta">--</span>
    </div>
    <div class="stat">
      <span class="stat-label">饭后运动</span>
      <span class="stat-value" id="stPostMeal">0 <small>次</small></span>
    </div>
  </div>

  <!-- 日历 -->
  <div class="card">
    <div class="card-title">
      我的减脂日历
      <span class="legend"><i>✓</i> 表示当天完成饭后运动</span>
    </div>

    <!-- 月份控制条 -->
    <div class="month-bar">
      <div class="mb-left">
        <button class="mb-arrow" id="mbPrev" title="上个月">‹</button>
        <span class="mb-title" id="mbTitle">1月<small>2026</small></span>
        <button class="mb-arrow" id="mbNext" title="下个月">›</button>
      </div>
      <div class="mb-chips" id="mbChips"></div>
      <button class="mb-toggle" id="mbToggle">展开全年</button>
    </div>

    <div class="months single" id="months"></div>
  </div>

  <!-- 图表 -->
  <div class="charts">
    <div class="chart-card wide">
      <div class="chart-head">
        <h3>体重趋势</h3>
        <div class="range-switch" id="rangeSwitch">
          <button data-days="30" class="active">近30天</button>
          <button data-days="90">近90天</button>
          <button data-days="365">全年</button>
        </div>
      </div>
      <canvas id="weightChart" class="chart-canvas"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-head">
        <h3>运动时长</h3>
        <span class="hint">单位：分钟</span>
      </div>
      <canvas id="exerciseChart" class="chart-canvas"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-head">
        <h3>睡眠时长</h3>
        <span class="hint">单位：小时</span>
      </div>
      <canvas id="sleepChart" class="chart-canvas"></canvas>
    </div>
  </div>
</div>

<!-- 记录弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalDate">2026年1月1日<span>星期四</span></h2>
      <button class="icon-btn" id="closeModal">✕</button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label>体重（kg）</label>
        <input type="number" id="inWeight" step="0.1" min="0" placeholder="例如 68.5">
      </div>

      <div class="field">
        <label>饮食记录</label>
        <textarea id="inDiet" placeholder="早餐：鸡蛋 + 牛奶&#10;午餐：鸡胸肉沙拉&#10;晚餐：杂粮饭 + 青菜&#10;加餐：一个苹果"></textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label>入睡时间</label>
          <input type="time" id="inSleep">
        </div>
        <div class="field">
          <label>起床时间</label>
          <input type="time" id="inWake">
        </div>
      </div>
      <div class="sleep-hint" id="sleepHint">睡眠时长：--</div>

      <div class="field">
        <label>饭后运动</label>
        <button type="button" class="post-meal-btn" id="postMealBtn">
          <span class="pm-box"></span>
          <span class="pm-text">点击标记：今天完成饭后运动</span>
          <span class="pm-tag">已打卡</span>
        </button>
      </div>

      <div class="field">
        <label>运动记录</label>
        <div id="exerciseList"></div>
        <button type="button" class="btn-ghost" id="addExercise">＋ 添加一项运动</button>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn danger" id="btnDelete">删除记录</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==================== 基础工具 ==================== */
  const $ = s => document.querySelector(s);
  const DAY = 86400000;
  const pad2 = n => String(n).padStart(2, '0');
  const keyOf = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => { const t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); };

    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r);

    if (v <= 0) return 1;

    const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return m * base;
  }

  function sleepHours(rec) {
    if (!rec || !rec.sleep || !rec.wake) return null;
    const [sh, sm] = rec.sleep.split(':').map(Number);
    const [wh, wm] = rec.wake.split(':').map(Number);
    if ([sh, sm, wh, wm].some(n => isNaN(n))) return null;
    let mins = (wh * 60 + wm) - (sh * 60 + sm);
    if (mins < 0) mins += 1440;
